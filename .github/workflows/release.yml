name: release

# Builds the same archives the working session produced (bundle + one per skill)
# and attaches them to a GitHub Release, with checksums. Releases are the right
# home for the zips: they are versioned, immutable-ish, and an installer can
# point at a stable URL. npm is for the package; GitHub Releases for the files.
#
# Asset names are never re-used across runs: clobbering the same asset name makes
# the release CDN serve stale bytes to anonymous downloads for a while, which
# looks exactly like a corrupted release. New name = new object.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: build zips
        run: |
          set -euo pipefail
          V=$(python3 -c "import json;print(json.load(open('MANIFEST.json'))['version'])")
          mkdir -p dist
          find . -name __pycache__ -type d -exec rm -rf {} + || true
          zip -qr "dist/keyless-agent-skills-pack-v$V.zip" \
            GUIDE.md README.md MANIFEST.json SECURITY.md LICENSE NOTICE DISCLOSURE \
            install.sh test-all.sh sync.sh \
            shared packaging .github \
            skill-router anon-image anon-audio ffmpeg-pipeline \
            web-search fetch-page deep-research examples/README.md \
            -x "*/__pycache__/*" "*.pyc" "packaging/dist-repo/*" "*.tgz" "dist/*"
          for s in skill-router anon-image anon-audio ffmpeg-pipeline web-search fetch-page deep-research; do
            zip -qr "dist/$s-v$V.zip" "$s" -x "*/__pycache__/*" "*.pyc"
          done
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Agent skills pack ${GITHUB_REF_NAME}. See GUIDE.md inside the bundle." \
            --verify-tag || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
